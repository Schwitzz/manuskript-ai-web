[project]
name = "moduskript-server"
version = "0.01.1"
description = "Self-hosted web backend for Moduskript"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "cryptography>=43",
    "httpx>=0.27",
    "lxml>=5.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "msklib*"]
